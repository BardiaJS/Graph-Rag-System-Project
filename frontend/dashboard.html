<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph-RAG · Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-start);
            min-height: 100vh;
            color: #f0f0ff;
        }

        /* ===== NAVBAR ===== */
        .navbar-custom {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-custom .brand {
            color: #f0f0ff;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-custom .brand i {
            color: var(--primary-light);
            font-size: 1.5rem;
        }

        .navbar-custom .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .navbar-custom .user-name {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ===== SPECULAR BUTTON - LOGOUT ===== */
        .specular-button-logout {
            --sb-radius: 10px;
            --sb-tint: #ef4444;
            --sb-tint-opacity: 0.15;
            --sb-blur: 0px;
            --sb-text-color: #fca5a5;

            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin: 0;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.01em;
            line-height: 1;
            color: var(--sb-text-color);
            background: color-mix(in srgb, var(--sb-tint) calc(var(--sb-tint-opacity) * 100%), transparent);
            border-radius: var(--sb-radius);
            backdrop-filter: blur(var(--sb-blur));
            -webkit-backdrop-filter: blur(var(--sb-blur));
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            padding: 8px 14px;
            font-size: 0.85rem;
            text-decoration: none;
            overflow: hidden;
        }

        .specular-button-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            color: #fff;
        }

        .specular-button-logout .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.15) 0%,
                transparent 70%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: var(--sb-radius);
        }

        .specular-button-logout:hover .shine {
            opacity: 1;
        }

        .specular-button-logout__label {
            position: relative;
            z-index: 2;
        }

        /* ===== SPECULAR BUTTON - PRIMARY ===== */
        .specular-button-primary {
            --sb-radius: 12px;
            --sb-tint: #ffffff;
            --sb-tint-opacity: 0;
            --sb-blur: 0px;
            --sb-text-color: #f5f5f5;

            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            margin: 0;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1;
            color: var(--sb-text-color);
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            border-radius: var(--sb-radius);
            backdrop-filter: blur(var(--sb-blur));
            -webkit-backdrop-filter: blur(var(--sb-blur));
            box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            padding: 10px 22px;
            font-size: 0.9rem;
            text-decoration: none;
            overflow: hidden;
            color: #fff;
        }

        .specular-button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #8b5cf6, #818cf8);
            color: #fff;
        }

        .specular-button-primary:active {
            transform: scale(0.97);
        }

        .specular-button-primary .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 70%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: var(--sb-radius);
        }

        .specular-button-primary:hover .shine {
            opacity: 1;
        }

        .specular-button-primary .glow-line {
            position: absolute;
            inset: 0;
            border-radius: var(--sb-radius);
            padding: 1.5px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.2) 0%,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0) 70%,
                rgba(255, 255, 255, 0.1) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .specular-button-primary__label {
            position: relative;
            z-index: 2;
        }

        .specular-button-primary .spinner-border {
            position: relative;
            z-index: 2;
        }

        /* ===== SPECULAR BUTTON - SUCCESS ===== */
        .specular-button-success {
            --sb-radius: 12px;
            --sb-tint: #ffffff;
            --sb-tint-opacity: 0;
            --sb-blur: 0px;
            --sb-text-color: #f5f5f5;

            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            margin: 0;
            width: 100%;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1;
            color: var(--sb-text-color);
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: var(--sb-radius);
            backdrop-filter: blur(var(--sb-blur));
            -webkit-backdrop-filter: blur(var(--sb-blur));
            box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.3);
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            padding: 12px 20px;
            font-size: 0.95rem;
            text-decoration: none;
            overflow: hidden;
            color: #fff;
        }

        .specular-button-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #fff;
        }

        .specular-button-success:active {
            transform: scale(0.97);
        }

        .specular-button-success .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 70%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: var(--sb-radius);
        }

        .specular-button-success:hover .shine {
            opacity: 1;
        }

        .specular-button-success .glow-line {
            position: absolute;
            inset: 0;
            border-radius: var(--sb-radius);
            padding: 1.5px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.2) 0%,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0) 70%,
                rgba(255, 255, 255, 0.1) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .specular-button-success__label {
            position: relative;
            z-index: 2;
        }

        .specular-button-success .spinner-border {
            position: relative;
            z-index: 2;
        }

        /* ===== CONTAINER ===== */
        .main-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        /* ===== HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .page-header h3 {
            font-weight: 700;
            font-size: 1.6rem;
            color: #f0f0ff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h3 i {
            color: var(--primary-light);
        }

        /* ===== CARDS ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 28px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(167, 139, 250, 0.15);
        }

        /* ===== NEW SESSION FORM ===== */
        #newSessionForm {
            display: none;
        }

        #newSessionForm.show {
            display: block;
        }

        #newSessionForm .form-control {
            border-radius: 12px;
            padding: 12px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #f0f0ff;
            transition: all 0.25s ease;
        }

        #newSessionForm .form-control::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        #newSessionForm .form-control:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            outline: none;
            color: #f0f0ff;
        }

        .btn-outline-secondary-custom {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 6px 16px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-outline-secondary-custom:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== SESSION ITEMS ===== */
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 14px;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(167, 139, 250, 0.2);
            transform: translateX(4px);
        }

        .session-item .session-title {
            font-weight: 600;
            color: #f0f0ff;
            font-size: 1rem;
        }

        .session-item .session-meta {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
        }

        .session-item .session-meta .badge {
            background: rgba(99, 102, 241, 0.2) !important;
            color: var(--primary-light);
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
        }

        .session-item .session-actions {
            display: none;
            gap: 6px;
        }

        .session-item:hover .session-actions {
            display: flex;
        }

        /* ===== SPECULAR BUTTON - ENTER ===== */
        .specular-button-enter {
            --sb-radius: 8px;
            --sb-tint: #ffffff;
            --sb-tint-opacity: 0;
            --sb-blur: 0px;
            --sb-text-color: #f5f5f5;

            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            margin: 0;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.01em;
            line-height: 1;
            color: var(--sb-text-color);
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            border-radius: var(--sb-radius);
            backdrop-filter: blur(var(--sb-blur));
            -webkit-backdrop-filter: blur(var(--sb-blur));
            box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            padding: 6px 16px;
            font-size: 0.8rem;
            text-decoration: none;
            overflow: hidden;
            color: #fff;
        }

        .specular-button-enter:hover {
            background: linear-gradient(135deg, #8b5cf6, #818cf8);
            color: #fff;
            transform: scale(1.02);
        }

        .specular-button-enter:active {
            transform: scale(0.97);
        }

        .specular-button-enter .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 70%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: var(--sb-radius);
        }

        .specular-button-enter:hover .shine {
            opacity: 1;
        }

        .specular-button-enter__label {
            position: relative;
            z-index: 2;
        }

        /* ===== ICON BUTTONS ===== */
        .btn-icon {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-icon.danger:hover {
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .empty-state i {
            font-size: 52px;
            color: rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }

        .empty-state h5 {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.9rem;
        }

        .empty-state .specular-button-primary {
            margin-top: 12px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            z-index: 9999;
        }

        .toast {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #f0f0ff;
        }

        .toast .toast-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #f0f0ff;
        }

        .toast .toast-header .btn-close {
            filter: invert(1) brightness(0.6);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .navbar-custom {
                padding: 12px 16px;
            }
            .navbar-custom .brand {
                font-size: 1.1rem;
            }
            .navbar-custom .user-name {
                font-size: 0.75rem;
            }
            .main-container {
                padding: 20px 16px 40px;
            }
            .page-header h3 {
                font-size: 1.3rem;
            }
            .session-item {
                flex-wrap: wrap;
                gap: 10px;
            }
            .session-item .session-actions {
                display: flex !important;
                width: 100%;
                justify-content: flex-end;
            }
            .glass-card {
                padding: 18px 16px;
            }
            #newSessionForm .row {
                flex-direction: column;
            }
            #newSessionForm .col-8,
            #newSessionForm .col-4 {
                width: 100%;
            }
            .specular-button-primary {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .specular-button-success {
                padding: 10px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar-custom d-flex justify-content-between align-items-center">
        <div class="brand">
            <i class="fas fa-brain"></i>
            Graph-RAG
        </div>
        <div class="user-info">
            <span class="user-name" id="userNameDisplay">User</span>
            <button class="specular-button-logout" onclick="logout()">
                <span class="shine"></span>
                <span class="specular-button-logout__label">
                    <i class="fas fa-sign-out-alt"></i>
                </span>
            </button>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-container">
        <div class="page-header">
            <h3>
                <i class="fas fa-comments"></i> My Sessions
            </h3>
            <button class="specular-button-primary" id="newSessionBtn">
                <span class="shine"></span>
                <span class="glow-line"></span>
                <span class="specular-button-primary__label">
                    <i class="fas fa-plus me-1"></i> New Session
                </span>
            </button>
        </div>

        <!-- ===== NEW SESSION FORM ===== -->
        <div id="newSessionForm" class="glass-card">
            <div class="row g-2">
                <div class="col-8">
                    <input type="text" class="form-control" id="newSessionTitle" placeholder="Enter session title...">
                </div>
                <div class="col-4">
                    <button class="specular-button-success w-100" id="saveSessionBtn">
                        <span class="shine"></span>
                        <span class="glow-line"></span>
                        <span class="specular-button-success__label">
                            <i class="fas fa-save me-1"></i> Create
                        </span>
                    </button>
                </div>
            </div>
            <button class="btn-outline-secondary-custom mt-2" id="cancelSessionBtn">Cancel</button>
        </div>

        <!-- ===== SESSIONS LIST ===== -->
        <div id="sessionsList">
            <div class="empty-state">
                <i class="fas fa-comments"></i>
                <h5>No sessions yet</h5>
                <p>Create your first session to get started</p>
                <button class="specular-button-primary" onclick="showNewSessionForm()">
                    <span class="shine"></span>
                    <span class="glow-line"></span>
                    <span class="specular-button-primary__label">
                        <i class="fas fa-plus me-1"></i> New Session
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="position-fixed bottom-0 end-0 p-3 toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notice</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">Message</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        // ============================================================
        //  SPECULAR BUTTON SETUP
        // ============================================================
        function setupSpecularButton(button) {
            if (!button) return;

            const shine = button.querySelector('.shine');
            if (!shine) return;

            button.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                shine.style.setProperty('--mouse-x', x + '%');
                shine.style.setProperty('--mouse-y', y + '%');
            });

            button.addEventListener('mouseleave', function() {
                shine.style.opacity = '0';
            });

            button.addEventListener('mouseenter', function() {
                shine.style.opacity = '1';
            });
        }

        function initAllSpecularButtons() {
            document.querySelectorAll('.specular-button-primary, .specular-button-success, .specular-button-enter, .specular-button-logout')
                .forEach(btn => {
                    setupSpecularButton(btn);
                });
        }

        // ============================================================
        //  CONFIG
        // ============================================================
        const API_URL = 'http://localhost:8000/api';
        const TOKEN = localStorage.getItem('api_token') || '';

        // ============================================================
        //  HELPERS
        // ============================================================
        function showToast(title, message, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            toast.className = `toast border-${type === 'success' ? 'success' : type === 'danger' ? 'danger' : 'primary'}`;
            new bootstrap.Toast(toast).show();
        }

        function getHeaders() {
            return {
                'Authorization': `Bearer ${TOKEN}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        //  USER
        // ============================================================
        document.getElementById('userNameDisplay').textContent = localStorage.getItem('user_name') || 'User';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // ============================================================
        //  SESSIONS
        // ============================================================
        function showNewSessionForm() {
            const form = document.getElementById('newSessionForm');
            form.classList.add('show');
            document.getElementById('newSessionTitle').focus();
        }

        document.getElementById('newSessionBtn').addEventListener('click', showNewSessionForm);

        document.getElementById('cancelSessionBtn').addEventListener('click', function() {
            document.getElementById('newSessionForm').classList.remove('show');
            document.getElementById('newSessionTitle').value = '';
        });

        // ===== CREATE SESSION =====
        document.getElementById('saveSessionBtn').addEventListener('click', async function() {
            const title = document.getElementById('newSessionTitle').value.trim();
            if (!title) {
                showToast('Notice', 'Please enter a session title.', 'warning');
                return;
            }

            const btn = this;
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `
                        <span class="spinner-border spinner-border-sm me-1"></span>
                        <span class="specular-button-success__label">Creating...</span>
                    `;

            try {
                const res = await fetch(`${API_URL}/sessions/create/${localStorage.getItem('user_id') || 1}`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ title, status: 'active' })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Success', 'New session created!', 'success');
                    document.getElementById('newSessionForm').classList.remove('show');
                    document.getElementById('newSessionTitle').value = '';
                    await loadSessions();
                } else {
                    showToast('Error', data.message || 'Failed to create session.', 'danger');
                }
            } catch (e) {
                showToast('Error', 'Server connection error.', 'danger');
            }
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        });

        // ===== GET SESSIONS =====
        async function loadSessions() {
            const container = document.getElementById('sessionsList');
            try {
                if (!TOKEN) {
                    container.innerHTML = `
                                <div class="alert alert-warning">
                                    ⚠️ Please <a href="login.html" style="color: #a78bfa;">log in</a> first.
                                </div>
                            `;
                    return;
                }

                const res = await fetch(`${API_URL}/sessions`, {
                    headers: getHeaders()
                });
                if (!res.ok) throw new Error('Failed to load sessions');
                const data = await res.json();
                const sessions = data.sessions || data.data || [];

                if (!sessions.length) {
                    container.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-comments"></i>
                                    <h5>No sessions yet</h5>
                                    <p>Create your first session to get started</p>
                                    <button class="specular-button-primary" onclick="showNewSessionForm()">
                                        <span class="shine"></span>
                                        <span class="glow-line"></span>
                                        <span class="specular-button-primary__label">
                                            <i class="fas fa-plus me-1"></i> New Session
                                        </span>
                                    </button>
                                </div>
                            `;
                    // Setup new button
                    const newBtn = container.querySelector('.specular-button-primary');
                    if (newBtn) setupSpecularButton(newBtn);
                    return;
                }

                container.innerHTML = sessions.map(s => `
                            <div class="session-item" onclick="window.location.href='session.html?id=${s.id}'">
                                <div>
                                    <div class="session-title">${s.title || 'Untitled'}</div>
                                    <div class="session-meta">
                                        <span class="badge">${s.status || 'active'}</span>
                                        <span class="ms-2">${formatDate(s.created_at)}</span>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="specular-button-enter" onclick="event.stopPropagation(); window.location.href='session.html?id=${s.id}'">
                                        <span class="shine"></span>
                                        <span class="specular-button-enter__label">
                                            Enter <i class="fas fa-arrow-right"></i>
                                        </span>
                                    </button>
                                    <div class="session-actions">
                                        <button class="btn-icon" onclick="event.stopPropagation(); editSession(${s.id}, '${s.title || ''}')">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn-icon danger" onclick="event.stopPropagation(); deleteSession(${s.id})">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('');

                // Setup specular buttons for enter buttons
                document.querySelectorAll('.specular-button-enter').forEach(btn => {
                    setupSpecularButton(btn);
                });

            } catch (e) {
                console.error('Error loading sessions:', e);
                container.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
            }
        }

        // ===== EDIT SESSION =====
        function editSession(id, title) {
            const newTitle = prompt('Enter new session title:', title);
            if (!newTitle || newTitle === title) return;

            fetch(`${API_URL}/sessions/${id}/update`, {
                    method: 'PATCH',
                    headers: getHeaders(),
                    body: JSON.stringify({ title: newTitle })
                })
                .then(res => {
                    if (res.ok) {
                        showToast('Success', 'Session updated!', 'success');
                        loadSessions();
                    } else {
                        res.json().then(data => showToast('Error', data.message || 'Update failed.', 'danger'));
                    }
                })
                .catch(() => showToast('Error', 'Server connection error.', 'danger'));
        }

        // ===== DELETE SESSION =====
        async function deleteSession(id) {
            if (!confirm(`Are you sure you want to delete this session?`)) return;

            try {
                const res = await fetch(`${API_URL}/sessions/${id}/delete`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if (res.ok) {
                    showToast('Success', 'Session deleted.', 'success');
                    loadSessions();
                } else {
                    const data = await res.json();
                    showToast('Error', data.message || 'Delete failed.', 'danger');
                }
            } catch (e) {
                showToast('Error', 'Server connection error.', 'danger');
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (!TOKEN) {
                window.location.href = 'login.html';
                return;
            }
            initAllSpecularButtons();
            loadSessions();
        });
    </script>
</body>
</html>

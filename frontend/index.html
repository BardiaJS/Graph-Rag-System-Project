<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Graph-RAG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loader"></div>
        <h2>Graph-RAG</h2>
        <p>در حال بررسی وضعیت ورود...</p>
    </div>

    <script>
        const token = localStorage.getItem('api_token');
        const API_URL = (localStorage.getItem('graph_rag_api_url') || ((location.hostname === 'localhost' && location.port === '8000') ? `${location.origin}/api` : 'http://localhost:8000/api')).replace(/\/$/, '');
        async function parseResponse(response) {
            const text = await response.text();
            if (!text) return {};
            try { return JSON.parse(text); } catch { return { message: text.slice(0, 500) }; }
        }
        function unwrap(data) { return data?.data ?? data; }

        if (token) {
            fetch(`${API_URL}/user`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            })
            .then(res => {
                if (!res.ok) {
                    window.location.href = 'login.html';
                    return;
                }
                return parseResponse(res);
            })
            .then(data => {
                const payload = unwrap(data);
                const user = payload?.user || payload?.data?.user || payload;
                if (user && user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (user && user.id) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'login.html';
                }
            })
            .catch(() => {
                window.location.href = 'login.html';
            });
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

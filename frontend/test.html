<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .success { color: #00b894; }
        .error { color: #e17055; }
        pre {
            background: #2d2d44;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        button {
            padding: 10px 20px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>🔍 تست API Graph-RAG</h1>
    
    <div id="result">
        <p>⏳ در حال تست...</p>
    </div>

    <button onclick="testLogin()">1️⃣ تست لاگین</button>
    <button onclick="testSessions()">2️⃣ تست سشن‌ها</button>
    <button onclick="goDashboard()">🚀 رفتن به داشبورد</button>
    <button onclick="clearToken()">🗑️ پاک کردن توکن</button>

    <script>
        const API_URL = 'http://localhost:8000/api';
        const LOGIN_DATA = {
            email: 'bsardroodi@gmail.com',
            password: 'bardia1382'
        };

        function showResult(html) {
            document.getElementById('result').innerHTML = html;
        }

        function clearToken() {
            localStorage.removeItem('api_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_name');
            localStorage.removeItem('user_email');
            showResult('<p class="success">✅ توکن پاک شد!</p>');
            console.log('🗑️ Token cleared');
        }

        async function testLogin() {
            showResult('<p>⏳ در حال ارسال درخواست لاگین...</p>');
            
            try {
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(LOGIN_DATA)
                });

                const data = await response.json();
                
                if (response.ok) {
                    // ذخیره توکن
                    localStorage.setItem('api_token', data.token);
                    localStorage.setItem('user_id', data.user?.id || 1);
                    localStorage.setItem('user_name', data.user?.name || 'کاربر');
                    localStorage.setItem('user_email', data.user?.email || '');
                    
                    showResult(`
                        <p class="success">✅ لاگین موفق!</p>
                        <p><strong>User:</strong> ${data.user?.name}</p>
                        <p><strong>Email:</strong> ${data.user?.email}</p>
                        <p><strong>Token:</strong> <code>${data.token}</code></p>
                        <p style="color: #6c5ce7;">💾 توکن در localStorage ذخیره شد</p>
                    `);
                    
                    console.log('✅ Login success:', data);
                } else {
                    showResult(`
                        <p class="error">❌ لاگین ناموفق</p>
                        <p>${data.message || 'خطای ناشناخته'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                }
            } catch(error) {
                showResult(`
                    <p class="error">❌ خطا در ارتباط با سرور</p>
                    <p>${error.message}</p>
                `);
                console.error('❌ Error:', error);
            }
        }

        async function testSessions() {
            const token = localStorage.getItem('api_token');
            
            if (!token) {
                showResult('<p class="error">❌ ابتدا لاگین کنید!</p>');
                return;
            }

            showResult('<p>⏳ در حال دریافت سشن‌ها...</p>');
            
            try {
                const response = await fetch(`${API_URL}/sessions`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult(`
                        <p class="success">✅ سشن‌ها دریافت شدند!</p>
                        <p><strong>تعداد:</strong> ${data.sessions?.length || 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                    console.log('✅ Sessions:', data);
                } else {
                    showResult(`
                        <p class="error">❌ خطا در دریافت سشن‌ها</p>
                        <p>Status: ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                }
            } catch(error) {
                showResult(`
                    <p class="error">❌ خطا در ارتباط با سرور</p>
                    <p>${error.message}</p>
                `);
                console.error('❌ Error:', error);
            }
        }

        function goDashboard() {
            const token = localStorage.getItem('api_token');
            if (!token) {
                alert('❌ ابتدا لاگین کنید!');
                return;
            }
            window.location.href = 'dashboard.html';
        }

        // اجرای خودکار تست لاگین هنگام باز شدن صفحه
        window.onload = function() {
            const token = localStorage.getItem('api_token');
            if (token) {
                showResult(`
                    <p class="success">✅ توکن موجود است</p>
                    <p><code>${token}</code></p>
                    <p>👆 برای تست سشن‌ها، دکمه 2 را بزنید</p>
                `);
                testSessions();
            } else {
                showResult('<p>👆 برای تست لاگین، دکمه 1 را بزنید</p>');
            }
        };
    </script>
</body>
</html>
